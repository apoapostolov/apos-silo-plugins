name: Release

# A tag is cut only after the assets are uploaded, so this workflow verifies the
# published release instead of rebuilding it. It answers one question: does the
# tag carry the nine binaries a Silo server installs, do their embedded
# manifests match the source they were tagged from, and does repository.json
# point at this tag? A release failing this check is one the catalog should not
# advertise.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to verify, for example v1.0.14'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve the tag under test
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          # The tag reaches a shell, so only the shape this repository cuts is
          # accepted, never an arbitrary ref.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing tag outside v<major>.<minor>.<patch>: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Every asset the catalog advertises is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            apple-podcasts-darwin-arm64 apple-podcasts-linux-amd64 apple-podcasts-linux-arm64 \
            comicinfo-darwin-arm64 comicinfo-linux-amd64 comicinfo-linux-arm64 \
            trakt-darwin-arm64 trakt-linux-amd64 trakt-linux-arm64 | sort)"
          actual="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "Asset list does not match what a Silo server installs."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "All nine assets present."

      - name: Download the linux binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded --pattern '*-linux-amd64'
          chmod +x downloaded/*
          ls downloaded

      - name: The catalog matches the release
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import urllib.request

          tag = sys.argv[1]
          catalog = json.load(open("repository.json", encoding="utf-8"))
          prefix = {
              "silo.comicinfo-metadata": "comicinfo",
              "community.watchprovider.trakt": "trakt",
              "silo.apple-podcasts-metadata": "apple-podcasts",
          }
          problems = []
          for entry in catalog.get("plugins", []):
              plugin_id = entry.get("manifest", {}).get("plugin_id", "")
              binaries = entry.get("binaries") or {}
              if plugin_id not in prefix:
                  problems.append(f"{plugin_id}: unknown plugin in the catalog")
                  continue
              # An unchanged binary keeps the URL of the release that first
              # shipped it, so the tag in the URL is not necessarily this one.
              # What must hold is that the URL still downloads something.
              for platform in ("linux/amd64", "linux/arm64", "darwin/arm64"):
                  info = binaries.get(platform)
                  if not info:
                      problems.append(f"{plugin_id}: catalog has no {platform} binary")
                      continue
                  url = info.get("url", "")
                  if "/releases/download/" not in url:
                      problems.append(f"{plugin_id} {platform}: not a release URL: {url}")
                      continue
                  request = urllib.request.Request(url, method="HEAD")
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          if response.status != 200:
                              problems.append(f"{plugin_id} {platform}: HTTP {response.status} for {url}")
                  except Exception as error:  # noqa: BLE001 - any failure is a broken pointer
                      problems.append(f"{plugin_id} {platform}: {error} for {url}")
              local = pathlib.Path("downloaded") / f"{prefix[plugin_id]}-linux-amd64"
              expected = (binaries.get("linux/amd64") or {}).get("checksum")
              if local.exists() and expected:
                  digest = hashlib.sha256(local.read_bytes()).hexdigest()
                  if digest != expected:
                      problems.append(
                          f"{plugin_id}: published binary is {digest}, catalog says {expected}"
                      )
          if problems:
              for problem in problems:
                  print(problem)
              raise SystemExit(1)
          print(f"catalog points at live URLs and the {tag} binaries match their checksums")
          PY

      - name: Embedded manifests match the tagged source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          status=0
          check() {
            binary="$1"
            manifest="$2"
            built="$(./downloaded/$binary manifest | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            source="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$manifest")"
            echo "$binary reports $built, $manifest says $source"
            if [ "$built" != "$source" ]; then
              status=1
            fi
          }
          check comicinfo-linux-amd64 plugins/metadata-comicinfo/manifest.json || status=1
          check trakt-linux-amd64 plugins/watchprovider-trakt/manifest.json || status=1
          check apple-podcasts-linux-amd64 plugins/metadata-apple-podcasts/manifest.json || status=1
          exit "$status"
